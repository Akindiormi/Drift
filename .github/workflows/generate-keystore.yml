name: Generate release keystore (one-time setup)

# Run this once from the Actions tab ("Run workflow"), download the
# resulting "drift-keystore-setup" artifact, open setup-values.txt inside
# it, and paste the 4 values into Settings → Secrets and variables →
# Actions → New repository secret. Then delete this workflow file (or just
# leave it — it does nothing unless you manually run it again) and
# consider re-running it if you ever need to rotate the key.
#
# Do NOT lose the downloaded .jks / passwords once you have a real app on
# the Play Store under this signature — Google requires every future
# update to be signed with the same key.

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and passwords
        run: |
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          ALIAS="drift"

          keytool -genkeypair -v \
            -keystore drift-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Drift, OU=EarnPal Solutions, O=EarnPal Solutions, L=Lagos, ST=Lagos, C=NG"

          base64 -w0 drift-release.jks > drift-release.jks.b64

          {
            echo "Paste these into GitHub → your repo → Settings → Secrets and variables → Actions → New repository secret."
            echo "Create 4 secrets with these exact names and values:"
            echo
            echo "DRIFT_KEYSTORE_BASE64"
            cat drift-release.jks.b64
            echo
            echo "DRIFT_KEYSTORE_PASSWORD"
            echo "$STORE_PASS"
            echo
            echo "DRIFT_KEY_PASSWORD"
            echo "$KEY_PASS"
            echo
            echo "DRIFT_KEY_ALIAS"
            echo "$ALIAS"
            echo
            echo "After adding all 4 secrets, push any commit (or re-run the main Build workflow) and it will produce a signed drift-release-aab artifact you can upload straight to Play Console."
          } > setup-values.txt

      - name: Upload setup bundle
        uses: actions/upload-artifact@v4
        with:
          name: drift-keystore-setup
          path: |
            setup-values.txt
            drift-release.jks
          retention-days: 3
